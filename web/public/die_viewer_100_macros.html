<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ace-Seek: Dynamic DEF & ODB Die Floorplan Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #090d1a;
      border-bottom: 1px solid #1e293b;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .logo-zone {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1 {
      font-size: 16px;
      margin: 0;
      color: #38bdf8;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge {
      background: #0284c7;
      color: #fff;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .controls-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    button, label.btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      user-select: none;
    }
    button:hover, label.btn:hover {
      background: #334155;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
    .stats-strip {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 6px 20px;
      display: flex;
      gap: 24px;
      font-size: 11px;
      color: #94a3b8;
      flex-shrink: 0;
      align-items: center;
      overflow-x: auto;
    }
    .stats-strip strong {
      color: #10b981;
      font-family: monospace;
      font-size: 12px;
    }
    .cursor-pos {
      margin-left: auto;
      font-family: monospace;
      color: #38bdf8;
      font-weight: bold;
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: #020617;
      overflow: hidden;
      cursor: grab;
    }
    #viewport-container.panning {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      color: #f8fafc;
      pointer-events: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      z-index: 100;
      max-width: 320px;
      line-height: 1.4;
    }
    #tooltip .title {
      font-weight: bold;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    #tooltip .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    #tooltip .lbl { color: #94a3b8; }
    #tooltip .val { font-family: monospace; color: #f1f5f9; font-weight: 600; }
    #drop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      border: 3px dashed #38bdf8;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      z-index: 200;
    }
    .layer-menu {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      color: #cbd5e1;
      backdrop-filter: blur(8px);
      z-index: 50;
    }
    .layer-menu label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .zoom-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 50;
    }
    .zoom-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      justify-content: center;
      font-size: 16px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-zone">
      <h1>Ace-Seek DEF Floorplan Engine</h1>
      <span class="badge" id="source-badge">Parsed from DEF</span>
    </div>
    <div class="controls-zone">
      <button id="btn-soc" class="active" onclick="loadPreset('soc')">⚡ 100-Macro SoC DEF</button>
      <button id="btn-ibex" onclick="loadPreset('ibex')">🏛️ Ibex Core (16K Cells) DEF</button>
      <label class="btn" for="file-input">
        📁 Load Local .DEF
        <input type="file" id="file-input" accept=".def,.txt" style="display:none;" onchange="handleFileSelect(event)">
      </label>
      <button onclick="resetView()">⟲ Reset Zoom</button>
    </div>
  </header>

  <div class="stats-strip">
    <div>Design: <strong id="stat-design">—</strong></div>
    <div>Die Area: <strong id="stat-area">—</strong></div>
    <div>Total Components: <strong id="stat-total">0</strong></div>
    <div>Hard Macros: <strong id="stat-macros">0</strong></div>
    <div>Parse Time: <strong id="stat-time">0 ms</strong></div>
    <div class="cursor-pos" id="stat-cursor">X: 0.00 µm  Y: 0.00 µm</div>
  </div>

  <div id="viewport-container">
    <canvas id="layout-canvas"></canvas>
    <div id="tooltip"></div>
    <div id="drop-overlay">Drop .def file anywhere to parse and render</div>

    <div class="layer-menu">
      <div style="font-weight: bold; color:#38bdf8; margin-bottom: 2px;">LAYERS</div>
      <label><input type="checkbox" id="layer-die" checked onchange="redraw()"> Die Boundary</label>
      <label><input type="checkbox" id="layer-grid" checked onchange="redraw()"> Grid Lines (100 µm)</label>
      <label><input type="checkbox" id="layer-halos" checked onchange="redraw()"> Keepout Halos</label>
      <label><input type="checkbox" id="layer-macros" checked onchange="redraw()"> Macros</label>
      <label><input type="checkbox" id="layer-cells" checked onchange="redraw()"> Standard Cells</label>
      <label><input type="checkbox" id="layer-labels" checked onchange="redraw()"> Labels</label>
    </div>

    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomBy(1.3)" title="Zoom In">+</button>
      <button class="zoom-btn" onclick="zoomBy(0.7)" title="Zoom Out">−</button>
      <button class="zoom-btn" onclick="resetView()" title="Fit to Die">⛶</button>
    </div>
  </div>

  <script>
    // --- State & Layout Engine ---
    let currentData = null;
    let canvas = document.getElementById("layout-canvas");
    let ctx = canvas.getContext("2d");
    let container = document.getElementById("viewport-container");
    let tooltip = document.getElementById("tooltip");

    // Camera transform: viewX = (chipX - camX) * scale + canvasWidth / 2
    let camX = 1300, camY = 1300;
    let scale = 0.28;
    let isPanning = false;
    let panStartX = 0, panStartY = 0;
    let camStartX = 0, camStartY = 0;

    const PALETTE = [
      '#38bdf8', '#818cf8', '#a855f7', '#ec4899', '#f43f5e',
      '#f97316', '#eab308', '#10b981', '#06b6d4', '#6366f1'
    ];

    function resizeCanvas() {
      canvas.width = container.clientWidth * window.devicePixelRatio;
      canvas.height = container.clientHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      redraw();
    }
    window.addEventListener("resize", resizeCanvas);

    // --- Fast In-Browser DEF Parser ---
    function parseClientDef(text, filename) {
      const t0 = performance.now();
      let designName = "unknown_design";
      let unitsDbu = 1000.0;
      let dieArea = { llx: 0, lly: 0, urx: 1000, ury: 1000, widthUm: 1000, heightUm: 1000 };
      const components = [];
      const lines = text.split(/\r?\n/);
      let inComponents = false;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line || line.startsWith("#")) continue;

        if (line.startsWith("DESIGN")) {
          const p = line.split(/\s+/);
          if (p.length >= 2) designName = p[1].replace(";", "");
        } else if (line.startsWith("UNITS DISTANCE MICRONS")) {
          const p = line.split(/\s+/);
          if (p.length >= 4) {
            const u = parseFloat(p[3]);
            if (!isNaN(u) && u > 0) unitsDbu = u;
          }
        } else if (line.startsWith("DIEAREA")) {
          const nums = line.match(/[-]?\d+/g);
          if (nums && nums.length >= 4) {
            const llx = parseFloat(nums[0]) / unitsDbu;
            const lly = parseFloat(nums[1]) / unitsDbu;
            const urx = parseFloat(nums[2]) / unitsDbu;
            const ury = parseFloat(nums[3]) / unitsDbu;
            dieArea = { llx, lly, urx, ury, widthUm: Math.abs(urx - llx), heightUm: Math.abs(ury - lly) };
          }
        } else if (line.startsWith("COMPONENTS")) {
          inComponents = true;
        } else if (inComponents && line.startsWith("END COMPONENTS")) {
          inComponents = false;
        } else if (inComponents && line.startsWith("-")) {
          const parts = line.split(/\s+/);
          if (parts.length >= 3) {
            const name = parts[1];
            const cellType = parts[2];
            let x = 0, y = 0, orient = "N", status = "UNPLACED";
            const mPos = line.match(/\+\s*(PLACED|FIXED|COVER|UNPLACED)\s*\(\s*([-\d]+)\s+([-\d]+)\s*\)\s*([A-Za-z0-9_]+)?/);
            if (mPos) {
              status = mPos[1];
              x = parseFloat(mPos[2]) / unitsDbu;
              y = parseFloat(mPos[3]) / unitsDbu;
              orient = mPos[4] || "N";
            }
            const isMacro = /sram|ram|macro|mem|rom|pll|phy/i.test(cellType) || /macro/i.test(name);
            let w = isMacro ? 80.0 : 2.5;
            let h = isMacro ? 80.0 : 2.72;
            const sizeMatch = line.match(/size=\(\s*([\d.]+)\s*x\s*([\d.]+)\s*\)/i);
            if (sizeMatch) {
              w = parseFloat(sizeMatch[1]);
              h = parseFloat(sizeMatch[2]);
            }
            components.push({ id: components.length, name, cellType, x, y, w, h, orient, status, isMacro });
          }
        }
      }

      const t1 = performance.now();
      return {
        ok: true,
        filename,
        designName,
        unitsDbu,
        dieArea,
        totalComponents: components.length,
        placedComponents: components.filter(c => c.status !== "UNPLACED").length,
        macroCount: components.filter(c => c.isMacro).length,
        components,
        parseTimeMs: Math.round((t1 - t0) * 100) / 100,
      };
    }

    // --- Loading & Presets ---
    async function loadPreset(name) {
      document.getElementById("btn-soc").classList.toggle("active", name === "soc");
      document.getElementById("btn-ibex").classList.toggle("active", name === "ibex");
      document.getElementById("source-badge").innerText = `Loading ${name.toUpperCase()} DEF…`;

      try {
        const res = await fetch(`/api/openroad/def/parse?preset=${name}`);
        const data = await res.json();
        if (data.ok) {
          applyData(data);
          document.getElementById("source-badge").innerText = `Live Parsed from ${data.filename}`;
        }
      } catch (err) {
        console.error("Preset load error:", err);
      }
    }

    function handleFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      readFile(file);
    }

    function readFile(file) {
      document.getElementById("btn-soc").classList.remove("active");
      document.getElementById("btn-ibex").classList.remove("active");
      document.getElementById("source-badge").innerText = `Parsing ${file.name}…`;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const text = evt.target.result;
        const parsed = parseClientDef(text, file.name);
        applyData(parsed);
        document.getElementById("source-badge").innerText = `Client Parsed (${file.name})`;
      };
      reader.readAsText(file);
    }

    function applyData(data) {
      currentData = data;
      document.getElementById("stat-design").innerText = data.designName;
      document.getElementById("stat-area").innerText = `${data.dieArea.widthUm.toFixed(1)} × ${data.dieArea.heightUm.toFixed(1)} µm`;
      document.getElementById("stat-total").innerText = data.totalComponents.toLocaleString();
      document.getElementById("stat-macros").innerText = data.macroCount.toLocaleString();
      document.getElementById("stat-time").innerText = `${data.parseTimeMs} ms`;

      resetView();
    }

    function resetView() {
      if (!currentData) return;
      const w = currentData.dieArea.widthUm;
      const h = currentData.dieArea.heightUm;
      camX = currentData.dieArea.llx + w / 2;
      camY = currentData.dieArea.lly + h / 2;

      const cw = container.clientWidth;
      const ch = container.clientHeight;
      scale = Math.min((cw * 0.85) / w, (ch * 0.85) / h);
      redraw();
    }

    function zoomBy(factor) {
      scale *= factor;
      scale = Math.max(0.01, Math.min(50.0, scale));
      redraw();
    }

    // --- Coordinate Transforms ---
    function chipToScreen(x, y) {
      const cw = container.clientWidth;
      const ch = container.clientHeight;
      const sx = (x - camX) * scale + cw / 2;
      const sy = ch / 2 - (y - camY) * scale;
      return { x: sx, y: sy };
    }

    function screenToChip(sx, sy) {
      const cw = container.clientWidth;
      const ch = container.clientHeight;
      const cx = (sx - cw / 2) / scale + camX;
      const cy = (ch / 2 - sy) / scale + camY;
      return { x: cx, y: cy };
    }

    // --- Rendering Pipeline ---
    function redraw() {
      const cw = container.clientWidth;
      const ch = container.clientHeight;
      ctx.clearRect(0, 0, cw, ch);

      if (!currentData) return;

      const drawDie = document.getElementById("layer-die").checked;
      const drawGrid = document.getElementById("layer-grid").checked;
      const drawHalos = document.getElementById("layer-halos").checked;
      const drawMacros = document.getElementById("layer-macros").checked;
      const drawCells = document.getElementById("layer-cells").checked;
      const drawLabels = document.getElementById("layer-labels").checked;

      const die = currentData.dieArea;

      // 1. Grid
      if (drawGrid) {
        ctx.strokeStyle = "#172033";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);

        const step = die.widthUm > 1000 ? 200 : 50;
        for (let gx = Math.floor(die.llx); gx <= die.urx; gx += step) {
          const p1 = chipToScreen(gx, die.lly);
          const p2 = chipToScreen(gx, die.ury);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
        for (let gy = Math.floor(die.lly); gy <= die.ury; gy += step) {
          const p1 = chipToScreen(die.llx, gy);
          const p2 = chipToScreen(die.urx, gy);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }

      // 2. Die Boundary
      if (drawDie) {
        const p1 = chipToScreen(die.llx, die.ury);
        const dw = die.widthUm * scale;
        const dh = die.heightUm * scale;
        ctx.fillStyle = "#050811";
        ctx.fillRect(p1.x, p1.y, dw, dh);
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = Math.max(2, 3 * (scale / 0.5));
        ctx.strokeRect(p1.x, p1.y, dw, dh);
      }

      // 3. Components
      const comps = currentData.components;
      const isDense = comps.length > 500;

      for (let i = 0; i < comps.length; i++) {
        const c = comps[i];
        if (c.status === "UNPLACED") continue;
        if (c.isMacro && !drawMacros) continue;
        if (!c.isMacro && !drawCells) continue;

        const pos = chipToScreen(c.x, c.y + c.h);
        const w = c.w * scale;
        const h = c.h * scale;

        // Skip offscreen
        if (pos.x + w < 0 || pos.x > cw || pos.y + h < 0 || pos.y > ch) continue;

        const color = PALETTE[c.id % PALETTE.length];

        if (c.isMacro) {
          // Keepout Halos
          if (drawHalos) {
            const hPos = chipToScreen(c.x - 8.0, c.y + c.h + 8.0);
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.25;
            ctx.setLineDash([3, 3]);
            ctx.strokeRect(hPos.x, hPos.y, (c.w + 16.0) * scale, (c.h + 16.0) * scale);
            ctx.setLineDash([]);
            ctx.globalAlpha = 1.0;
          }

          // Macro Body
          ctx.fillStyle = color;
          ctx.globalAlpha = 0.85;
          ctx.fillRect(pos.x, pos.y, w, h);
          ctx.globalAlpha = 1.0;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = Math.max(1, 1.5 * (scale / 0.5));
          ctx.strokeRect(pos.x, pos.y, w, h);

          // Labels
          if (drawLabels && w > 20 && h > 14) {
            ctx.fillStyle = "#ffffff";
            const fSize = Math.max(9, Math.min(14, h * 0.25));
            ctx.font = `bold ${fSize}px monospace`;
            ctx.textAlign = "center";
            ctx.fillText(c.name, pos.x + w / 2, pos.y + h / 2 - 2);
            ctx.fillStyle = "#cbd5e1";
            ctx.font = `${Math.max(8, fSize - 3)}px monospace`;
            ctx.fillText(c.orient, pos.x + w / 2, pos.y + h / 2 + fSize);
          }
        } else {
          // Standard Cells
          ctx.fillStyle = "#475569";
          ctx.fillRect(pos.x, pos.y, Math.max(1, w), Math.max(1, h));
          if (scale > 2.0) {
            ctx.strokeStyle = "#64748b";
            ctx.lineWidth = 0.5;
            ctx.strokeRect(pos.x, pos.y, w, h);
          }
        }
      }
    }

    // --- Mouse & Pan/Zoom Handlers ---
    container.addEventListener("mousedown", (e) => {
      isPanning = true;
      container.classList.add("panning");
      panStartX = e.clientX;
      panStartY = e.clientY;
      camStartX = camX;
      camStartY = camY;
    });

    window.addEventListener("mouseup", () => {
      isPanning = false;
      container.classList.remove("panning");
    });

    container.addEventListener("mousemove", (e) => {
      const rect = container.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (isPanning) {
        const dx = (e.clientX - panStartX) / scale;
        const dy = (e.clientY - panStartY) / scale;
        camX = camStartX - dx;
        camY = camStartY + dy;
        redraw();
      }

      // Cursor chip coordinates
      const chipPos = screenToChip(mouseX, mouseY);
      document.getElementById("stat-cursor").innerText =
        `X: ${chipPos.x.toFixed(2)} µm  Y: ${chipPos.y.toFixed(2)} µm`;

      // Tooltip on Hover
      if (!isPanning && currentData) {
        const found = currentData.components.find((c) => {
          return chipPos.x >= c.x && chipPos.x <= c.x + c.w &&
                 chipPos.y >= c.y && chipPos.y <= c.y + c.h;
        });

        if (found) {
          tooltip.style.display = "block";
          tooltip.style.left = `${mouseX + 14}px`;
          tooltip.style.top = `${mouseY + 14}px`;
          tooltip.innerHTML = `
            <div class="title">${found.name}</div>
            <div class="row"><span class="lbl">Cell Type:</span><span class="val">${found.cellType}</span></div>
            <div class="row"><span class="lbl">Coordinates:</span><span class="val">(${found.x.toFixed(2)}, ${found.y.toFixed(2)}) µm</span></div>
            <div class="row"><span class="lbl">Dimensions:</span><span class="val">${found.w.toFixed(1)} × ${found.h.toFixed(1)} µm</span></div>
            <div class="row"><span class="lbl">Orientation:</span><span class="val">${found.orient}</span></div>
            <div class="row"><span class="lbl">Status:</span><span class="val">${found.status}</span></div>
          `;
        } else {
          tooltip.style.display = "none";
        }
      }
    });

    container.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = container.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const chipBefore = screenToChip(mouseX, mouseY);
      const factor = e.deltaY < 0 ? 1.18 : 0.85;
      scale *= factor;
      scale = Math.max(0.01, Math.min(60.0, scale));

      const chipAfter = screenToChip(mouseX, mouseY);
      camX -= (chipAfter.x - chipBefore.x);
      camY -= (chipAfter.y - chipBefore.y);

      redraw();
    }, { passive: false });

    // Drag & Drop
    window.addEventListener("dragover", (e) => {
      e.preventDefault();
      document.getElementById("drop-overlay").style.display = "flex";
    });
    window.addEventListener("dragleave", (e) => {
      if (e.clientX <= 0 || e.clientY <= 0) {
        document.getElementById("drop-overlay").style.display = "none";
      }
    });
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      document.getElementById("drop-overlay").style.display = "none";
      const file = e.dataTransfer.files?.[0];
      if (file) readFile(file);
    });

    // Initialize
    resizeCanvas();
    loadPreset('soc');
  </script>
</body>
</html>
