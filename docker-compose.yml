# AIC — production web UI (Oracle Cloud / any VPS)
# Maps host :80 → container :3000 (Next.js)
#
#   docker compose up -d --build
#   curl http://localhost/api/compile

services:
  aic-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: aic-web:latest
    container_name: aic-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      AIC_ROOT: /app
      AIC_FORCE_LOCAL: "1"
      AIC_BACKEND_DEFAULT: local
      # Public URLs (also set as build-args in Dockerfile.web)
      NEXT_PUBLIC_SITE_URL: https://www.ace-seek.com
      NEXT_PUBLIC_PORTAL_URL: https://portal.ace-seek.com
      NEXT_PUBLIC_OPENROAD_URL: https://openroad.ace-seek.com
      NEXT_PUBLIC_VLSI_URL: https://vlsi.ace-seek.com
      NEXT_PUBLIC_TOOLS_URL: https://tools.ace-seek.com
      # OpenROAD ASIC Runner configuration
      OPENROAD_RUNNER_ENABLED: "1"
      OPENROAD_JOBS_DIR: /data/ace-openroad-jobs
      PDK_ROOT: /data/volare
      PDK: sky130A
      OPENLANE_IMAGE: efabless/openlane:e73fb3c57e687a0023fcd4dcfd1566ecd478362a
      ACE_TOOLS_MODE: auto
      # Keep job/temp files inside a volume (survives restarts, not lost in container overlay)
      TMPDIR: /tmp/aic
    volumes:
      - aic-tmp:/tmp/aic
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/ace-openroad-jobs:/data/ace-openroad-jobs
      - /data/volare:/data/volare
    # Free-tier friendly defaults (uncomment/adjust for Always Free VM shape)
    # mem_limit: 6g
    # cpus: 2.0
    healthcheck:
      # busybox wget is available on Alpine-based pandoc/latex images
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/compile >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: aic-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aic-web

volumes:
  aic-tmp:
  caddy_data:
  caddy_config:
